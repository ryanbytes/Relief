name: Build Relief Launcher

on:
  push:
    branches: [ main ]
    paths:
      - "android/ReliefSetup/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-launcher.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "android/ReliefSetup/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Lint and build
        run: |
          gradle --no-daemon :android:ReliefSetup:lintDebug :android:ReliefSetup:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="android/ReliefSetup/build/outputs/apk/debug/ReliefSetup-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest.txt
          grep -q "package: name='app.relief.setup'" apk-badging.txt
          grep -q "android.intent.category.HOME" apk-manifest.txt
          cp "$APK" Relief-Launcher-0.2.0-debug.apk
          sha256sum Relief-Launcher-0.2.0-debug.apk | tee Relief-Launcher-0.2.0-debug.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Relief-Launcher-APK
          path: |
            Relief-Launcher-0.2.0-debug.apk
            Relief-Launcher-0.2.0-debug.apk.sha256
            apk-badging.txt
            apk-manifest.txt
          if-no-files-found: error

      - name: Publish rolling test release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete relief-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create relief-latest \
            Relief-Launcher-0.2.0-debug.apk \
            Relief-Launcher-0.2.0-debug.apk.sha256 \
            --title "Relief Launcher — latest verified test build" \
            --notes "Automatically built from main. Debug-signed test APK; use for evaluation. Stable releases will use a persistent private signing key."
