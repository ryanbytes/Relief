name: Build Relief Launcher

on:
  push:
    branches: [ main ]
    paths:
      - "android/ReliefSetup/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-launcher.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "android/ReliefSetup/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build and test SDKs
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Lint and build
        run: |
          gradle --no-daemon :android:ReliefSetup:lintDebug :android:ReliefSetup:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="android/ReliefSetup/build/outputs/apk/debug/ReliefSetup-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest.txt
          grep -q "package: name='app.relief.setup'" apk-badging.txt
          grep -q "android.intent.category.HOME" apk-manifest.txt
          cp "$APK" Relief-Launcher-0.2.0-debug.apk
          sha256sum Relief-Launcher-0.2.0-debug.apk | tee Relief-Launcher-0.2.0-debug.apk.sha256

      - name: Emulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          APK="$PWD/Relief-Launcher-0.2.0-debug.apk"
          echo no | avdmanager create avd \
            --force \
            --name relief-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6

          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd relief-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!

          sleep 5
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
            echo "Emulator exited before ADB became available." >&2
            cat emulator.log
            exit 1
          fi

          if ! timeout 120 adb wait-for-device; then
            echo "ADB did not see the emulator within 120 seconds." >&2
            cat emulator.log
            exit 1
          fi

          booted=0
          for _ in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$booted" != "1" ]]; then
            echo "Emulator did not complete Android boot." >&2
            cat emulator.log
            exit 1
          fi

          adb install -r "$APK"
          adb logcat -c

          adb shell am start -W -n app.relief.setup/.MainActivity | tee setup-start.txt
          grep -q "Status: ok" setup-start.txt
          adb shell pidof app.relief.setup >/dev/null

          adb shell am start -W \
            -a android.intent.action.MAIN \
            -c android.intent.category.HOME \
            -n app.relief.setup/.HomeActivity | tee home-start.txt
          grep -q "Status: ok" home-start.txt
          adb shell dumpsys activity activities | grep -q "app.relief.setup/.HomeActivity"

          sleep 2
          if adb logcat -d -v brief AndroidRuntime:E '*:S' | grep -q "FATAL EXCEPTION"; then
            adb logcat -d -v brief AndroidRuntime:E '*:S'
            exit 1
          fi

          adb exec-out screencap -p > relief-home.png
          adb emu kill || true

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Relief-Launcher-APK
          path: |
            Relief-Launcher-0.2.0-debug.apk
            Relief-Launcher-0.2.0-debug.apk.sha256
            apk-badging.txt
            apk-manifest.txt
            setup-start.txt
            home-start.txt
            relief-home.png
          if-no-files-found: error

      - name: Publish rolling test release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete relief-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create relief-latest \
            Relief-Launcher-0.2.0-debug.apk \
            Relief-Launcher-0.2.0-debug.apk.sha256 \
            --title "Relief Launcher — latest verified test build" \
            --notes "Built from main, linted, signature/manifest-verified, and smoke-tested by installing and launching Setup and Home in an Android emulator. Debug-signed test APK; stable releases will use a persistent private signing key."
